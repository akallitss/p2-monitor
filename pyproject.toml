[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "p2-monitor"
dynamic = ["version"]
description = "P2 VMM readout monitoring: counts, rates per channel/module/detector, data volume"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Alexandra Kallitsopoulou" }]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "p2-decode @ git+https://github.com/akallitss/p2-decode@v0.8.1",
    "p2-mapping @ git+https://github.com/akallitss/p2-mapping@v0.5.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
test = ["pytest", "matplotlib>=3.5"]

[project.scripts]
p2-monitor = "p2_monitor.cli:main"
p2-monitor-reduce = "p2_monitor.cli:reduce_main"
p2-monitor-qa = "p2_monitor.cli:qa_main"

[tool.setuptools.dynamic]
version = { attr = "p2_monitor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
